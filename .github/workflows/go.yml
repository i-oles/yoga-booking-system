name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Dependencies
        run: go mod download

      - name: Build
        run: make build

      - name: Docker
        run: docker build -t yoga-app .

      - name: Test
        run: make test

      - name: Linter
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          args: ./...
